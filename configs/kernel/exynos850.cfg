# Base DTB for the a12s boot image (consumed by vendor/lineage/build/tasks
# kernel.mk via BOARD_DTB_CFG; mkdtboimg cfg_create).
# exynos3830-a12s.dtb = stock Samsung base (exact copy of Samsung's
# exynos3830.dts; decompiles identical to the stock boot.img DTB payload).
# To boot-test the Lineage base DTB instead, change the entry below to
# "exynos3830.dtb" (keep the custom0/custom1 lines as-is).
exynos3830-a12s.dtb
    custom0=0x00000000
    custom1=0xff000000
